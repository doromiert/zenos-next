# rEFInd Configuration for ZenOS
timeout 5
use_nvram false
enable_mouse

# Higher resolution
resolution max

# Scan only for what we define manually or on external drives
scanfor external, optical, manual
dont_scan_dirs EFI/refind,EFI/systemd,EFI/BOOT,EFI/nixos
dont_scan_tools shell.efi,shellx64.efi
dont_scan_firmware shell

# NixOS entries (Dynamic - Generated by Python Script)
include zenos-entries.conf

# Theme include
include themes/zenos-picker/theme.conf
